<div class="card shadow-sm"><div class="card-body p-0"><div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead><tr><th>Code</th><th>Libellé</th><th>Type</th><th>Statut</th><th></th></tr></thead>
<tbody>
{% for journal in journals %}
<tr><td class="fw-semibold">{{ journal.code }}</td><td>{{ journal.name }}</td><td>{{ journal.get_journal_type_display }}</td>
<td>{% if journal.is_active %}<span class="badge text-bg-success">Actif</span>{% else %}<span class="badge text-bg-secondary">Inactif</span>{% endif %}</td>
<td class="text-end"><a class="btn btn-sm btn-outline-secondary" href="{% url 'accounting:journal-update' journal.pk %}">Modifier</a></td></tr>
{% empty %}<tr><td colspan="5" class="text-muted p-4">Aucun journal correspondant.</td></tr>{% endfor %}
</tbody></table></div></div></div>
