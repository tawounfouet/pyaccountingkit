          --test-result "${{ needs.test.result }}"
          --django-adapter-result "${{ needs.postgresql.result }}"
          --sqlalchemy-adapter-result "${{ needs.sqlalchemy-postgresql.result }}"
          --consumer-e2e-green "${{ needs.cutover-evidence.outputs.consumer_e2e_green }}"
          --identities-traceable "${{ needs.cutover-evidence.outputs.identities_traceable }}"
          --regulatory-authority-replaced "${{ needs.cutover-evidence.outputs.regulatory_authority_replaced }}"
          --output build/cfa_fra_retirement_readiness.json

  release-qualification:
    name: LOT-26 extended release qualification
    if: ${{ startsWith(github.head_ref, 'release/0.6') }}
    needs: [test, postgresql, sqlalchemy-postgresql, cutover-evidence, consumer-bootstrap, consumer-binding]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Require bound live consumer repository
        run: >-
          python scripts/validate_cfa_fra_consumer_binding.py
          --require-bound
      - name: Require release dependency binding output
        run: >-
          python -c
          "assert '${{ needs.consumer-binding.outputs.consumer_repository_bound }}' == 'true'"
      - name: Rebuild canonical live MIG-13 readiness
        run: >-
          python scripts/qualify_cfa_fra_retirement.py
          --test-result "${{ needs.test.result }}"
          --django-adapter-result "${{ needs.postgresql.result }}"
          --sqlalchemy-adapter-result "${{ needs.sqlalchemy-postgresql.result }}"
          --consumer-e2e-green "${{ needs.cutover-evidence.outputs.consumer_e2e_green }}"
          --identities-traceable "${{ needs.cutover-evidence.outputs.identities_traceable }}"
          --regulatory-authority-replaced "${{ needs.cutover-evidence.outputs.regulatory_authority_replaced }}"
          --output build/cfa_fra_live_retirement_readiness.json
      - name: Require canonical live MIG-13 READY
        run: >-
          python -c
          "import json; r=json.load(open('build/cfa_fra_live_retirement_readiness.json'));
          assert r['ready'] is True;
          assert r['blockers'] == [];
          assert r['expected_blockers'] == []"
      - name: Revalidate canonical live L26-C completion
        run: >-
          python scripts/qualify_cfa_fra_legacy_retirement_completion.py
          --readiness build/cfa_fra_live_retirement_readiness.json
          --plan tests/consumer/cfa_fra/live_evidence/legacy-retirement-plan.json
          --execution-evidence tests/consumer/cfa_fra/live_evidence/legacy-retirement-execution.json
          --output build/cfa_fra_live_retirement_completion.json
      - name: Require committed completion proof to match regenerated live proof
        run: >-
          python -c
          "import json;
          generated=json.load(open('build/cfa_fra_live_retirement_completion.json'));
          committed=json.load(open('tests/consumer/cfa_fra/live_evidence/legacy-retirement-completion.json'));
          assert generated == committed"
      - name: Require consumer binding revision to match completion
        run: >-
          python -c
          "import json;
          b=json.load(open('tests/consumer/cfa_fra/CONSUMER_BINDING.json'));
          c=json.load(open('build/cfa_fra_live_retirement_completion.json'));
          assert b['status']=='BOUND';
          assert b['binding']['environment']=='production';
          assert b['binding']['revision_sha']==c['consumer_revision']"
      - name: Run release-candidate qualification
        run: python scripts/qualify_release.py --release-candidate

