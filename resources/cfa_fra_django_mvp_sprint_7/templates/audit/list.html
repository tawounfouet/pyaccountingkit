{% extends "base.html" %}
{% block title %}Audit trail — CFA FRA{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="h3 mb-1">Audit trail</h1>
    <p class="text-muted mb-0">{{ organization.name }}</p>
  </div>
</div>

<form class="card card-body shadow-sm mb-3"
      hx-get="{% url 'audit:list' %}"
      hx-target="#audit-results"
      hx-trigger="keyup changed delay:350ms from:input, change from:select"
      hx-push-url="true">
  <div class="row g-2">
    <div class="col-md-7">
      <input class="form-control"
             type="search"
             name="q"
             value="{{ request.GET.q }}"
             placeholder="Action, type ou identifiant">
    </div>
    <div class="col-md-5">
      <select class="form-select" name="action">
        <option value="">Toutes les actions</option>
        {% for value in actions %}
          <option value="{{ value }}"
                  {% if request.GET.action == value %}selected{% endif %}>
            {{ value }}
          </option>
        {% endfor %}
      </select>
    </div>
  </div>
</form>

<div id="audit-results">
  {% include "audit/_table.html" %}
</div>
{% endblock %}
