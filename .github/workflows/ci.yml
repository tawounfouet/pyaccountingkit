name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Run canonical static engineering gates
        run: python scripts/qualify_release.py --skip-tests --skip-package

  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Run accounting qualification test suites
        run: python -m pytest tests/unit tests/property tests/contract tests/integration tests/golden tests/replay tests/concurrency -v --tb=short

  package:
    name: Package qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Build and verify wheel and sdist
        run: python scripts/verify_package.py

  postgresql:
    name: Django/PostgreSQL qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pyaccountingkit
          POSTGRES_USER: pyaccountingkit
          POSTGRES_PASSWORD: pyaccountingkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyaccountingkit -d pyaccountingkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.support.django_settings
      PYAK_POSTGRES_TEST: "1"
      PYAK_DB_NAME: pyaccountingkit
      PYAK_DB_USER: pyaccountingkit
      PYAK_DB_PASSWORD: pyaccountingkit
      PYAK_DB_HOST: 127.0.0.1
      PYAK_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install published Django adapter extra and test tooling
        run: python -m pip install -e ".[django]" pytest pytest-timeout
      - name: Apply fresh PostgreSQL migrations
        run: python -m django migrate --noinput
      - name: Require model and migration coherence
        run: python -m django makemigrations pyaccountingkit_django --check --dry-run
      - name: Run PostgreSQL adapter qualification
        run: >-
          python -m pytest
          tests/integration/test_django_postgresql_adapter.py
          tests/concurrency/test_django_postgresql_concurrency.py
          -v --tb=short

  sqlalchemy-postgresql:
    name: SQLAlchemy/PostgreSQL qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pyaccountingkit
          POSTGRES_USER: pyaccountingkit
          POSTGRES_PASSWORD: pyaccountingkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyaccountingkit -d pyaccountingkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYAK_SQLALCHEMY_POSTGRES_TEST: "1"
      PYAK_SQLALCHEMY_DATABASE_URL: postgresql+psycopg://pyaccountingkit:pyaccountingkit@127.0.0.1:5432/pyaccountingkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install published SQLAlchemy adapter extra and test tooling
        run: python -m pip install -e ".[sqlalchemy]" pytest pytest-timeout
      - name: Apply fresh Alembic migrations
        run: >-
          python -c
          "from pyaccountingkit.adapters.sqlalchemy.migrations import upgrade;
          import os; upgrade(os.environ['PYAK_SQLALCHEMY_DATABASE_URL'])"
      - name: Require Declarative metadata and migration coherence
        run: python scripts/check_sqlalchemy_metadata.py
      - name: Run SQLAlchemy/PostgreSQL adapter qualification
        run: >-
          python -m pytest
          tests/integration/test_sqlalchemy_postgresql_adapter.py
          tests/concurrency/test_sqlalchemy_postgresql_concurrency.py
          -v --tb=short

  consumer-evidence:
    name: CFA FRA consumer evidence
    runs-on: ubuntu-latest
    outputs:
      consumer_e2e_green: ${{ steps.consumer-state.outputs.consumer_e2e_green }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            resources/cfa_fra_django_mvp_sprint_7/pyproject.toml
      - name: Install PyAccountingKit and bundled CFA FRA test dependencies
        run: >-
          python -m pip install
          -e ".[dev]"
          -e "./resources/cfa_fra_django_mvp_sprint_7[dev]"
      - name: Execute bundled CFA FRA consumer evidence
        run: >-
          python scripts/qualify_cfa_fra_consumer.py
          --output build/cfa_fra_consumer_evidence.json
      - name: Expose consumer E2E state
        id: consumer-state
        run: |
          value="$(python -c 'import json; print(str(json.load(open("build/cfa_fra_consumer_evidence.json"))["consumer_e2e_green"]).lower())')"
          echo "consumer_e2e_green=$value" >> "$GITHUB_OUTPUT"

  retirement-inventory:
    name: CFA FRA retirement inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Validate legacy-retirement inventory
        run: python scripts/validate_cfa_fra_retirement_inventory.py

  cutover-evidence:
    name: CFA FRA live cutover evidence
    runs-on: ubuntu-latest
    outputs:
      identities_traceable: ${{ steps.cutover-state.outputs.identities_traceable }}
      regulatory_authority_replaced: ${{ steps.cutover-state.outputs.regulatory_authority_replaced }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Validate and verify live cutover evidence
        run: >-
          python scripts/validate_cfa_fra_cutover_evidence.py
          --output build/cfa_fra_cutover_evidence.json
      - name: Expose verified cutover state
        id: cutover-state
        run: |
          identities="$(python -c 'import json; print(str(json.load(open("build/cfa_fra_cutover_evidence.json"))["identities_traceable"]).lower())')"
          authority="$(python -c 'import json; print(str(json.load(open("build/cfa_fra_cutover_evidence.json"))["regulatory_authority_replaced"]).lower())')"
          echo "identities_traceable=$identities" >> "$GITHUB_OUTPUT"
          echo "regulatory_authority_replaced=$authority" >> "$GITHUB_OUTPUT"

  cutover-pipeline:
    name: CFA FRA cutover evidence pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Prepare isolated retirement manifest
        run: >-
          mkdir -p build/cfa_fra_cutover_pipeline &&
          cp tests/fixtures/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
      - name: Plan identity evidence transition
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          plan legacy_identities
          --source tests/fixtures/cfa_fra_cutover_generation/identity-source.json
          --artifact legacy-identities.json
          --evidence-source ci-cutover-pipeline
          --observed-at 2026-09-30T15:00:00Z
          --producer github-actions
          --plan-output build/cfa_fra_cutover_pipeline/identity-plan.json
      - name: Apply reviewed identity plan
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          apply
          --plan build/cfa_fra_cutover_pipeline/identity-plan.json
      - name: Plan regulatory authority transition
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          plan regulatory_authority
          --source tests/fixtures/cfa_fra_cutover_generation/regulatory-source.json
          --artifact regulatory-authority.json
          --evidence-source ci-cutover-pipeline
          --observed-at 2026-09-30T15:00:00Z
          --producer github-actions
          --plan-output build/cfa_fra_cutover_pipeline/authority-plan.json
      - name: Apply reviewed regulatory plan
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          apply
          --plan build/cfa_fra_cutover_pipeline/authority-plan.json
      - name: Require only consumer E2E blocker after fixture pipeline
        run: >-
          python -c
          "import json; p=json.load(open('build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json'));
          assert p['expected_blockers'] == ['evidence:consumer-e2e'];
          assert p['external_evidence']['legacy_identities']['status'] == 'PASS';
          assert p['external_evidence']['regulatory_authority']['status'] == 'PASS'"

  retirement-readiness:
    name: CFA FRA retirement readiness
    needs:
      [test, postgresql, sqlalchemy-postgresql, consumer-evidence, retirement-inventory, cutover-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Qualify MIG-13 retirement readiness
        run: >-
          python scripts/qualify_cfa_fra_retirement.py
          --test-result "${{ needs.test.result }}"
          --django-adapter-result "${{ needs.postgresql.result }}"
          --sqlalchemy-adapter-result "${{ needs.sqlalchemy-postgresql.result }}"
          --consumer-e2e-green "${{ needs.consumer-evidence.outputs.consumer_e2e_green }}"
          --identities-traceable "${{ needs.cutover-evidence.outputs.identities_traceable }}"
          --regulatory-authority-replaced "${{ needs.cutover-evidence.outputs.regulatory_authority_replaced }}"
          --output build/cfa_fra_retirement_readiness.json

  release-qualification:
    name: Extended release qualification
    if: ${{ startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Run release-candidate qualification
        run: python scripts/qualify_release.py --release-candidate

  ci-gate:
    name: Canonical CI gate
    if: ${{ always() }}
    needs:
      [quality, test, package, postgresql, sqlalchemy-postgresql, consumer-evidence, retirement-inventory, cutover-evidence, cutover-pipeline, retirement-readiness, release-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every canonical CI dependency
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          POSTGRESQL_RESULT: ${{ needs.postgresql.result }}
          SQLALCHEMY_POSTGRESQL_RESULT: ${{ needs.sqlalchemy-postgresql.result }}
          CONSUMER_EVIDENCE_RESULT: ${{ needs.consumer-evidence.result }}
          RETIREMENT_INVENTORY_RESULT: ${{ needs.retirement-inventory.result }}
          CUTOVER_EVIDENCE_RESULT: ${{ needs.cutover-evidence.result }}
          CUTOVER_PIPELINE_RESULT: ${{ needs.cutover-pipeline.result }}
          RETIREMENT_READINESS_RESULT: ${{ needs.retirement-readiness.result }}
          RELEASE_QUALIFICATION_RESULT: ${{ needs.release-qualification.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$POSTGRESQL_RESULT" = "success"
          test "$SQLALCHEMY_POSTGRESQL_RESULT" = "success"
          test "$CONSUMER_EVIDENCE_RESULT" = "success"
          test "$RETIREMENT_INVENTORY_RESULT" = "success"
          test "$CUTOVER_EVIDENCE_RESULT" = "success"
          test "$CUTOVER_PIPELINE_RESULT" = "success"
          test "$RETIREMENT_READINESS_RESULT" = "success"
          test "$RELEASE_QUALIFICATION_RESULT" = "success" || test "$RELEASE_QUALIFICATION_RESULT" = "skipped"
