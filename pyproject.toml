[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyaccountingkit"
version = "0.0.1"
description = "A Python toolkit for double-entry accounting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pyaccountingkit contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "build>=1.2",
    "twine>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyaccountingkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
