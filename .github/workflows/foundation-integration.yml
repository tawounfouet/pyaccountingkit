name: Standalone Foundation package & integration (FND-C06)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-install-contract:
    name: Wheel + sdist / isolated install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate unsigned G0 G1 G2 decision record (HOLD is valid)
        run: python scripts/check_foundation_gate_dossier.py
      - name: Build sdist and wheel as isolated distributions
        run: |
          python -m pip install 'build>=1,<3'
          python -m build
      - name: Check exact bundled SQL migrations, file inventory and package identity
        run: python scripts/qualify_foundation_artifacts.py . dist
      - name: Install ONLY the built wheel in a clean virtual environment
        shell: bash
        run: |
          python -m venv .fnd-c06-venv
          .fnd-c06-venv/bin/python -m pip install --no-deps dist/*.whl
          .fnd-c06-venv/bin/python - <<'PY'
          from importlib import resources
          from importlib.metadata import version
          from pathlib import Path
          import pyaccountingkit
          import pyaccountingkit.company_configuration
          from pyaccountingkit.company_configuration.domain.shared import effective_interval

          assert version("pyaccountingkit") == "0.0.0", "Foundation version is not a stable release"
          assert "site-packages" in str(Path(pyaccountingkit.__file__).resolve())
          assert hasattr(effective_interval, "KnowledgeInterval")
          name = "pyaccountingkit.company_configuration.infrastructure.postgres.migrations"
          sql_names = sorted(
              x.name for x in resources.files(name).iterdir() if x.name.endswith(".sql")
          )
          assert [int(x[:4]) for x in sql_names] == list(range(1, 15))
          print("PASS isolated wheel install, import and 14 packaged SQL migrations")
          PY
      - name: Compile installed distribution to catch packaging errors
        run: .fnd-c06-venv/bin/python -m compileall -q .fnd-c06-venv/lib
