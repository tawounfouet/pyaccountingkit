name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  django-postgresql-qualification:
    name: Release Django/PostgreSQL qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      qualified_sha: ${{ steps.qualification-evidence.outputs.qualified_sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pyaccountingkit
          POSTGRES_USER: pyaccountingkit
          POSTGRES_PASSWORD: pyaccountingkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyaccountingkit -d pyaccountingkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.support.django_settings
      PYAK_POSTGRES_TEST: "1"
      PYAK_DB_NAME: pyaccountingkit
      PYAK_DB_USER: pyaccountingkit
      PYAK_DB_PASSWORD: pyaccountingkit
      PYAK_DB_HOST: 127.0.0.1
      PYAK_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Django adapter qualification dependencies
        run: python -m pip install -e ".[django]" pytest pytest-timeout
      - name: Apply fresh PostgreSQL migrations
        run: python -m django migrate --noinput
      - name: Require model and migration coherence
        run: python -m django makemigrations pyaccountingkit_django --check --dry-run
      - name: Run required Django/PostgreSQL release modules
        run: >-
          python -m pytest
          tests/integration/test_django_postgresql_adapter.py
          tests/concurrency/test_django_postgresql_concurrency.py
          -v --tb=short
      - name: Record exact qualified SHA
        id: qualification-evidence
        run: echo "qualified_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  sqlalchemy-postgresql-qualification:
    name: Release SQLAlchemy/PostgreSQL qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      qualified_sha: ${{ steps.qualification-evidence.outputs.qualified_sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pyaccountingkit
          POSTGRES_USER: pyaccountingkit
          POSTGRES_PASSWORD: pyaccountingkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyaccountingkit -d pyaccountingkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYAK_SQLALCHEMY_POSTGRES_TEST: "1"
      PYAK_SQLALCHEMY_DATABASE_URL: postgresql+psycopg://pyaccountingkit:pyaccountingkit@127.0.0.1:5432/pyaccountingkit
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install SQLAlchemy adapter qualification dependencies
        run: python -m pip install -e ".[sqlalchemy]" pytest pytest-timeout
      - name: Apply fresh Alembic migrations
        run: >-
          python -c
          "from pyaccountingkit.adapters.sqlalchemy.migrations import upgrade;
          import os; upgrade(os.environ['PYAK_SQLALCHEMY_DATABASE_URL'])"
      - name: Require Declarative metadata and migration coherence
        run: python scripts/check_sqlalchemy_metadata.py
      - name: Run required SQLAlchemy/PostgreSQL release modules
        run: >-
          python -m pytest
          tests/integration/test_sqlalchemy_postgresql_adapter.py
          tests/concurrency/test_sqlalchemy_postgresql_concurrency.py
          -v --tb=short
      - name: Record exact qualified SHA
        id: qualification-evidence
        run: echo "qualified_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  preflight:
    name: Release preflight and qualification
    needs: [django-postgresql-qualification, sqlalchemy-postgresql-qualification]
    runs-on: ubuntu-latest
    env:
      PYAK_RELEASE_DJANGO_POSTGRESQL_SHA: ${{ needs.django-postgresql-qualification.outputs.qualified_sha }}
      PYAK_RELEASE_SQLALCHEMY_POSTGRESQL_SHA: ${{ needs.sqlalchemy-postgresql-qualification.outputs.qualified_sha }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      prerelease: ${{ steps.release-metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release qualification tooling
        run: python -m pip install -e ".[dev]"
      - name: Refresh canonical main reference
        run: git fetch origin main --no-tags
      - name: Validate tag, version and main ancestry
        id: release-metadata
        run: >-
          python scripts/prepare_release.py preflight
          --tag "$GITHUB_REF_NAME"
          --sha "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"
      - name: Run fail-closed publication qualification
        run: python scripts/qualify_release.py --release-candidate
      - name: Enforce G5 for stable publication
        if: ${{ steps.release-metadata.outputs.prerelease == 'false' }}
        run: python scripts/validate_stable_gate.py

  build:
    name: Build immutable release bundle
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build, verify and seal distributions exactly once
        run: >-
          python scripts/prepare_release.py build
          --bundle-dir release-bundle
          --tag "$GITHUB_REF_NAME"
          --sha "$GITHUB_SHA"
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pyaccountingkit-release-${{ needs.preflight.outputs.version }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-pypi:
    name: Publish exact bundle to PyPI
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pyaccountingkit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Download sealed release bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: pyaccountingkit-release-${{ needs.preflight.outputs.version }}
          path: release-bundle
      - name: Reverify bundle before PyPI boundary
        run: >-
          python scripts/prepare_release.py verify
          --bundle-dir release-bundle
          --tag "$GITHUB_REF_NAME"
          --sha "$GITHUB_SHA"
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: release-bundle/dist/

  publication-smoke:
    name: Verify exact PyPI publication
    needs: [preflight, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact published version from PyPI
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install --no-cache-dir --upgrade "pyaccountingkit==${RELEASE_VERSION}"; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              exit 1
            fi
            sleep 10
          done
      - name: Smoke installed release outside checkout
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          python -c "import importlib.metadata as m; assert m.version('pyaccountingkit') == '${RELEASE_VERSION}'; import pyaccountingkit; assert pyaccountingkit.__version__ == '${RELEASE_VERSION}'"

  github-release:
    name: Publish GitHub Release from exact PyPI bundle
    needs: [preflight, build, publish-pypi, publication-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Download sealed release bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: pyaccountingkit-release-${{ needs.preflight.outputs.version }}
          path: release-bundle
      - name: Reverify bundle before GitHub Release boundary
        run: >-
          python scripts/prepare_release.py verify
          --bundle-dir release-bundle
          --tag "$GITHUB_REF_NAME"
          --sha "$GITHUB_SHA"
      - name: Create immutable release record
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-bundle/dist/*
            release-bundle/metadata/SHA256SUMS
            release-bundle/metadata/RELEASE_QUALIFICATION_MANIFEST.json
      - name: Publish fully populated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  release-integrity:
    name: Verify immutable GitHub Release
    needs: [github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify immutable release attestation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release verify "$GITHUB_REF_NAME"
