  ci-gate:
    name: Canonical CI gate
    if: ${{ always() }}
    needs:
      [quality, test, package, postgresql, sqlalchemy-postgresql, regulatory-qualification, consumer-bootstrap, consumer-publication, consumer-binding-advancement, consumer-binding, consumer-evidence, retirement-inventory, cutover-evidence, cutover-pipeline, retirement-plan, retirement-execution, retirement-completion, retirement-readiness, release-qualification, regulatory-release-qualification, stable-release-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every canonical CI dependency
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          POSTGRESQL_RESULT: ${{ needs.postgresql.result }}
          SQLALCHEMY_POSTGRESQL_RESULT: ${{ needs.sqlalchemy-postgresql.result }}
          REGULATORY_QUALIFICATION_RESULT: ${{ needs.regulatory-qualification.result }}
          CONSUMER_BOOTSTRAP_RESULT: ${{ needs.consumer-bootstrap.result }}
          CONSUMER_PUBLICATION_RESULT: ${{ needs.consumer-publication.result }}
          CONSUMER_BINDING_ADVANCEMENT_RESULT: ${{ needs.consumer-binding-advancement.result }}
          CONSUMER_BINDING_RESULT: ${{ needs.consumer-binding.result }}
          CONSUMER_EVIDENCE_RESULT: ${{ needs.consumer-evidence.result }}
          RETIREMENT_INVENTORY_RESULT: ${{ needs.retirement-inventory.result }}
          CUTOVER_EVIDENCE_RESULT: ${{ needs.cutover-evidence.result }}
          CUTOVER_PIPELINE_RESULT: ${{ needs.cutover-pipeline.result }}
          RETIREMENT_PLAN_RESULT: ${{ needs.retirement-plan.result }}
          RETIREMENT_EXECUTION_RESULT: ${{ needs.retirement-execution.result }}
          RETIREMENT_COMPLETION_RESULT: ${{ needs.retirement-completion.result }}
          RETIREMENT_READINESS_RESULT: ${{ needs.retirement-readiness.result }}
          RELEASE_QUALIFICATION_RESULT: ${{ needs.release-qualification.result }}
          REGULATORY_RELEASE_QUALIFICATION_RESULT: ${{ needs.regulatory-release-qualification.result }}
          STABLE_RELEASE_QUALIFICATION_RESULT: ${{ needs.stable-release-qualification.result }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$POSTGRESQL_RESULT" = "success"
          test "$SQLALCHEMY_POSTGRESQL_RESULT" = "success"
          test "$REGULATORY_QUALIFICATION_RESULT" = "success"
          if [[ "$HEAD_REF" == release/0.7.0rc* ]]; then
            test "$CONSUMER_BOOTSTRAP_RESULT" = "skipped"
            test "$CONSUMER_PUBLICATION_RESULT" = "skipped"
            test "$CONSUMER_BINDING_ADVANCEMENT_RESULT" = "skipped"
            test "$CONSUMER_BINDING_RESULT" = "skipped"
            test "$CONSUMER_EVIDENCE_RESULT" = "skipped"
            test "$RETIREMENT_INVENTORY_RESULT" = "skipped"
            test "$CUTOVER_EVIDENCE_RESULT" = "skipped"
            test "$CUTOVER_PIPELINE_RESULT" = "skipped"
            test "$RETIREMENT_PLAN_RESULT" = "skipped"
            test "$RETIREMENT_EXECUTION_RESULT" = "skipped"
            test "$RETIREMENT_COMPLETION_RESULT" = "skipped"
            test "$RETIREMENT_READINESS_RESULT" = "skipped"
            test "$RELEASE_QUALIFICATION_RESULT" = "skipped"
            test "$REGULATORY_RELEASE_QUALIFICATION_RESULT" = "success"
            test "$STABLE_RELEASE_QUALIFICATION_RESULT" = "skipped"
          elif [[ "$HEAD_REF" == release/0.7.0 ]]; then
            test "$CONSUMER_BOOTSTRAP_RESULT" = "skipped"
            test "$CONSUMER_PUBLICATION_RESULT" = "skipped"
            test "$CONSUMER_BINDING_ADVANCEMENT_RESULT" = "skipped"
            test "$CONSUMER_BINDING_RESULT" = "skipped"
            test "$CONSUMER_EVIDENCE_RESULT" = "skipped"
            test "$RETIREMENT_INVENTORY_RESULT" = "skipped"
            test "$CUTOVER_EVIDENCE_RESULT" = "skipped"
            test "$CUTOVER_PIPELINE_RESULT" = "skipped"
            test "$RETIREMENT_PLAN_RESULT" = "skipped"
            test "$RETIREMENT_EXECUTION_RESULT" = "skipped"
            test "$RETIREMENT_COMPLETION_RESULT" = "skipped"
            test "$RETIREMENT_READINESS_RESULT" = "skipped"
            test "$RELEASE_QUALIFICATION_RESULT" = "skipped"
            test "$REGULATORY_RELEASE_QUALIFICATION_RESULT" = "skipped"
            test "$STABLE_RELEASE_QUALIFICATION_RESULT" = "success"
          else
            test "$CONSUMER_BOOTSTRAP_RESULT" = "success"
            test "$CONSUMER_PUBLICATION_RESULT" = "success"
            test "$CONSUMER_BINDING_ADVANCEMENT_RESULT" = "success"
            test "$CONSUMER_BINDING_RESULT" = "success"
            test "$CONSUMER_EVIDENCE_RESULT" = "success"
            test "$RETIREMENT_INVENTORY_RESULT" = "success"
            test "$CUTOVER_EVIDENCE_RESULT" = "success"
            test "$CUTOVER_PIPELINE_RESULT" = "success"
            test "$RETIREMENT_PLAN_RESULT" = "success"
            test "$RETIREMENT_EXECUTION_RESULT" = "success"
            test "$RETIREMENT_COMPLETION_RESULT" = "success"
            test "$RETIREMENT_READINESS_RESULT" = "success"
            if [[ "$HEAD_REF" == release/0.6* ]]; then
              test "$RELEASE_QUALIFICATION_RESULT" = "success"
            else
              test "$RELEASE_QUALIFICATION_RESULT" = "skipped"
            fi
            test "$REGULATORY_RELEASE_QUALIFICATION_RESULT" = "skipped"
            test "$STABLE_RELEASE_QUALIFICATION_RESULT" = "skipped"
          fi
