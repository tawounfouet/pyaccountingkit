<form method="get" class="card card-body shadow-sm mb-4">
  {% for error in form.non_field_errors %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endfor %}
  <div class="row g-3 align-items-end">
    <div class="col-md-4">
      <label class="form-label">{{ form.fiscal_year.label }}</label>
      {{ form.fiscal_year }}
      {% for error in form.fiscal_year.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    <div class="col-md-4">
      <label class="form-label">{{ form.end_date.label }}</label>
      {{ form.end_date }}
      {% for error in form.end_date.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    <div class="col-md-4">
      <button class="btn btn-primary">Actualiser</button>
    </div>
  </div>
</form>
