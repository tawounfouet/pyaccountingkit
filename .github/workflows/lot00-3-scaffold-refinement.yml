name: LOT-00.3 scaffold refinement

on:
  push:
    branches:
      - chore/lot-00-3-scaffold-cleanup

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/lot-00-3-scaffold-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Enforce a pure bootstrap source scaffold
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          ROOT = Path.cwd()
          SRC = ROOT / "src" / "pyaccountingkit"
          TESTS = ROOT / "tests"
          EXAMPLES = ROOT / "examples"
          ROOT_INIT = SRC / "__init__.py"

          def is_docstring_expr(node: ast.stmt) -> bool:
              return (
                  isinstance(node, ast.Expr)
                  and isinstance(node.value, ast.Constant)
                  and isinstance(node.value.value, str)
              )

          neutralized: list[str] = []
          already_scaffold: list[str] = []

          for path in sorted(SRC.rglob("*.py")):
              if path == ROOT_INIT:
                  continue
              rel = path.relative_to(ROOT).as_posix()
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source, filename=rel)
              statements = list(tree.body)
              if statements and is_docstring_expr(statements[0]):
                  statements = statements[1:]

              if not statements:
                  already_scaffold.append(rel)
                  continue

              original_doc = ast.get_docstring(tree, clean=False) or ""
              plan_match = re.search(r"(PLAN-[A-Z0-9_.-]+\.md)", original_doc)
              plan_line = f"\nImplementation target: {plan_match.group(1)}.\n" if plan_match else "\n"
              module_name = rel.removeprefix("src/pyaccountingkit/")
              path.write_text(
                  '"""Bootstrap scaffold for PyAccountingKit.\n\n'
                  f'Module path: {module_name}.\n'
                  f'{plan_line}'
                  'PyAccountingKit 0.0.1 intentionally exposes no accounting-domain, adapter, integration, '
                  'application, port, or public-contract implementation from this module. The path is retained '
                  'only to preserve the target architecture and will receive real code in its owning milestone.\n'
                  '"""\n',
                  encoding="utf-8",
              )
              neutralized.append(rel)

          # Root package is intentionally version-only.
          root_tree = ast.parse(ROOT_INIT.read_text(encoding="utf-8"), filename=str(ROOT_INIT))
          allowed_names = {"__version__", "version"}
          business_symbols: set[str] = set()
          for node in root_tree.body:
              if is_docstring_expr(node):
                  continue
              if isinstance(node, ast.ImportFrom):
                  if node.module != "importlib.metadata":
                      business_symbols.update(alias.name for alias in node.names)
                  continue
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id not in allowed_names:
                          business_symbols.add(target.id)
                  continue
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  business_symbols.add(node.name)
          if business_symbols:
              raise SystemExit(f"Unexpected root business symbols: {sorted(business_symbols)}")

          # Every non-root Python package module must now be documentation-only.
          executable_modules: list[str] = []
          for path in sorted(SRC.rglob("*.py")):
              if path == ROOT_INIT:
                  continue
              rel = path.relative_to(ROOT).as_posix()
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=rel)
              statements = list(tree.body)
              if statements and is_docstring_expr(statements[0]):
                  statements = statements[1:]
              if statements:
                  executable_modules.append(rel)
          if executable_modules:
              raise SystemExit("Executable business modules remain in 0.0.1:\n" + "\n".join(executable_modules))

          remaining_test_files = sorted(path.relative_to(ROOT).as_posix() for path in TESTS.rglob("test_*.py"))
          if remaining_test_files:
              raise SystemExit("test_*.py modules unexpectedly remain after LOT-00.3:\n" + "\n".join(remaining_test_files))

          example_dirs = sorted(path.name for path in EXAMPLES.iterdir() if path.is_dir()) if EXAMPLES.exists() else []

          audit_dir = ROOT / "docs" / "audits"
          audit_dir.mkdir(parents=True, exist_ok=True)
          report = audit_dir / "2026-09-09_LOT_00_3_PLACEHOLDER_INVENTORY.md"
          all_scaffolds = sorted(neutralized + already_scaffold)
          report.write_text(
              "# LOT-00.3 - Repository & Scaffold Cleanup Inventory\n\n"
              "> Baseline target: PyAccountingKit `0.0.1` Repository Bootstrap.\n\n"
              "This inventory records the cleanup performed before any real accounting-domain implementation.\n\n"
              "## Decision\n\n"
              "`0.0.1` is an engineering bootstrap, not an accounting-engine release. Therefore the package root "
              "exposes version metadata only, while every other Python module under `src/pyaccountingkit/` is a "
              "documentation-only architectural scaffold. Module paths are retained so the roadmap structure is "
              "visible without advertising premature runtime behavior.\n\n"
              "## Cleanup policy\n\n"
              "- Preserve the package and namespace topology.\n"
              "- Remove all premature business classes, enums, DTOs, adapter shells, protocols and other executable symbols.\n"
              "- Preserve an implementation-target plan reference in a module docstring when one already existed.\n"
              "- Remove `test_*.py` files that contained no real tests; never replace them with `assert True`.\n"
              "- Classify all example directories as non-runnable future scaffolds.\n"
              "- Introduce no accounting behavior.\n\n"
              f"## Source modules neutralized during the final sweep ({len(neutralized)})\n\n"
              + ("\n".join(f"- `{item}`" for item in neutralized) or "- None")
              + "\n\n"
              f"## Total documentation-only source scaffold modules ({len(all_scaffolds)})\n\n"
              + "\n".join(f"- `{item}`" for item in all_scaffolds)
              + "\n\n"
              "## Test cleanup\n\n"
              "The initial LOT-00.3 sweep removed **43** `test_*.py` files after AST verification showed that none "
              "contained a real pytest/unittest test function or test class. No fake passing tests were introduced.\n\n"
              f"Remaining `test_*.py` files after cleanup: **{len(remaining_test_files)}**.\n\n"
              "## Examples\n\n"
              f"Example scaffold directories classified: **{len(example_dirs)}**.\n\n"
              + "\n".join(f"- `{name}/` - future, non-runnable scaffold in `0.0.1`" for name in example_dirs)
              + "\n\n"
              "## Exit criteria\n\n"
              "- Root accounting/business exports: **0**\n"
              "- Executable non-root package modules: **0**\n"
              "- Remaining fake `test_*.py` modules: **0**\n"
              "- Runnable examples claimed by `0.0.1`: **0**\n"
              "- Accounting features implemented by LOT-00.3: **0**\n\n"
              "Real bootstrap tests are intentionally introduced later by LOT-00.5; engineering safety scripts are "
              "introduced by LOT-00.4.\n",
              encoding="utf-8",
          )

          print(f"Final sweep neutralized modules: {len(neutralized)}")
          print(f"Documentation-only scaffold modules total: {len(all_scaffolds)}")
          print(f"Remaining test_*.py files: {len(remaining_test_files)}")
          print(f"Example scaffolds: {len(example_dirs)}")
          PY
      - name: Commit refinement and remove temporary workflow
        run: |
          rm -f .github/workflows/lot00-3-scaffold-refinement.yml
          git add -A
          git status --short
          git commit -m "chore(repo): enforce pure 0.0.1 bootstrap source scaffold"
          git push origin HEAD:chore/lot-00-3-scaffold-cleanup
