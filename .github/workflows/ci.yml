name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Run canonical static engineering gates
        run: python scripts/qualify_release.py --skip-tests --skip-package

  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Run Bootstrap test suite
        run: python -m pytest tests/unit tests/property tests/contract -v --tb=short

  package:
    name: Package qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Build and verify wheel and sdist
        run: python scripts/verify_package.py

  ci-gate:
    name: Canonical CI gate
    if: ${{ always() }}
    needs: [quality, test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every canonical CI dependency
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
