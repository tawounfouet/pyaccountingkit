          --output build/cfa_fra_legacy_retirement_plan.json
      - name: Build isolated completed execution evidence
        run: >-
          python -c
          "import hashlib,json,pathlib;
          p=json.load(open('build/cfa_fra_legacy_retirement_plan.json'));
          states={'RETIRE_DUPLICATE_ENGINE':'RETIRED','VERIFY_CONSUMER_REWIRED':'REWIRED','PRESERVE_OR_MIGRATE_PERSISTENCE':'PRESERVED','KEEP_CONSUMER_CONCERN':'PRESENT','PRESERVE_FROZEN_ORACLE':'PRESERVED'};
          obs=[{'path':i['path'],'state':states[i['action']],'source':'isolated-completion-ci-fixture','evidence_checksum':'sha256:'+hashlib.sha256((i['path']+':'+states[i['action']]).encode()).hexdigest()} for i in p['items']];
          e={'schema_version':'1','plan_sha256':p['plan_sha256'],'consumer_revision':'isolated-completed-consumer-revision','observations':obs};
          pathlib.Path('build/cfa_fra_retirement_execution_evidence.json').write_text(json.dumps(e,indent=2)+'\\n')"
      - name: Qualify L26-C retirement completion
        run: >-
          python scripts/qualify_cfa_fra_legacy_retirement_completion.py
          --readiness tests/fixtures/cfa_fra_retirement_plan/RETIREMENT_READINESS_READY.json
          --plan build/cfa_fra_legacy_retirement_plan.json
          --execution-evidence build/cfa_fra_retirement_execution_evidence.json
          --output build/cfa_fra_retirement_completion.json
      - name: Require RC1-eligible completion proof
        run: >-
          python -c
          "import json; c=json.load(open('build/cfa_fra_retirement_completion.json'));
          assert c['status']=='COMPLETE';
          assert c['ready_for_0_6_rc1'] is True;
          assert c['routing_target_only'] is True;
          assert c['action_counts']['RETIRE_DUPLICATE_ENGINE']==10;
          assert c['action_counts']['PRESERVE_FROZEN_ORACLE']==6"

  retirement-readiness:
