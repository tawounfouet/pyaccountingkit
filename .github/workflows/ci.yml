name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Run canonical static engineering gates
        run: python scripts/qualify_release.py --skip-tests --skip-package

  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Run accounting qualification test suites
        run: python -m pytest tests/unit tests/property tests/contract tests/integration tests/golden tests/replay tests/concurrency -v --tb=short

  package:
    name: Package qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Build and verify wheel and sdist
        run: python scripts/verify_package.py

  postgresql:
    name: Django/PostgreSQL qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pyaccountingkit
          POSTGRES_USER: pyaccountingkit
          POSTGRES_PASSWORD: pyaccountingkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyaccountingkit -d pyaccountingkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: tests.support.django_settings
      PYAK_POSTGRES_TEST: "1"
      PYAK_DB_NAME: pyaccountingkit
      PYAK_DB_USER: pyaccountingkit
      PYAK_DB_PASSWORD: pyaccountingkit
      PYAK_DB_HOST: 127.0.0.1
      PYAK_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install published Django adapter extra and test tooling
        run: python -m pip install -e ".[django]" pytest pytest-timeout
      - name: Apply fresh PostgreSQL migrations
        run: python -m django migrate --noinput
      - name: Require model and migration coherence
        run: python -m django makemigrations pyaccountingkit_django --check --dry-run
      - name: Run PostgreSQL adapter qualification
        run: >-
          python -m pytest
          tests/integration/test_django_postgresql_adapter.py
          tests/concurrency/test_django_postgresql_concurrency.py
          -v --tb=short

  sqlalchemy-postgresql:
    name: SQLAlchemy/PostgreSQL qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pyaccountingkit
          POSTGRES_USER: pyaccountingkit
          POSTGRES_PASSWORD: pyaccountingkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyaccountingkit -d pyaccountingkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYAK_SQLALCHEMY_POSTGRES_TEST: "1"
      PYAK_SQLALCHEMY_DATABASE_URL: postgresql+psycopg://pyaccountingkit:pyaccountingkit@127.0.0.1:5432/pyaccountingkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install published SQLAlchemy adapter extra and test tooling
        run: python -m pip install -e ".[sqlalchemy]" pytest pytest-timeout
      - name: Apply fresh Alembic migrations
        run: >-
          python -c
          "from pyaccountingkit.adapters.sqlalchemy.migrations import upgrade;
          import os; upgrade(os.environ['PYAK_SQLALCHEMY_DATABASE_URL'])"
      - name: Require Declarative metadata and migration coherence
        run: python scripts/check_sqlalchemy_metadata.py
      - name: Run SQLAlchemy/PostgreSQL adapter qualification
        run: >-
          python -m pytest
          tests/integration/test_sqlalchemy_postgresql_adapter.py
          tests/concurrency/test_sqlalchemy_postgresql_concurrency.py
          -v --tb=short

  regulatory-qualification:
    name: Regulatory capability qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Require deterministic capability-scoped matrix
        run: python scripts/generate_regulatory_compatibility_matrix.py --check
      - name: Run LOT-27 capability qualification
        run: >-
          python -m pytest
          tests/unit/integrations/test_regulatory_capability_qualification.py
          tests/unit/domain/test_effective_reference_plan.py
          tests/unit/adapters/test_nonprofit_reference_adapter.py
          tests/unit/domain/test_standard_relations.py
          tests/unit/adapters/test_ohada_relation_adapter.py
          tests/golden/regulatory/test_lot27_capability_profiles.py
          tests/golden/regulatory/test_nonprofit_effective_plan.py
          tests/golden/regulatory/test_ebnl_structure_provider.py
          tests/golden/regulatory/test_ohada_standard_relations.py
          tests/golden/regulatory/test_reporting_structure_provider.py
          tests/integration/test_0_7_regulatory_compatibility_matrix.py
          -v --tb=short
      - name: Require five explicit regulatory profiles
        run: >-
          python -c
          "import json;
          p=json.load(open('REGULATORY_COMPATIBILITY_MATRIX.json'));
          refs={x['standard_ref'] for x in p['regulatory_frameworks']};
          assert p['qualification_model']=='capability-scoped/v1';
          assert refs=={'fr-pcg:2026','fr-nonprofit:2026','ohada-syscohada:2017','ohada-ebnl:2023','cemac-pcemf:2010'}"

  consumer-bootstrap:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA standalone consumer bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Review deterministic standalone bootstrap
        run: >-
          python scripts/bootstrap_cfa_fra_live_consumer.py
          --destination build/cfa_fra_live_consumer_seed
      - name: Materialize isolated standalone bootstrap
        run: >-
          python scripts/bootstrap_cfa_fra_live_consumer.py
          --destination build/cfa_fra_live_consumer_seed
          --write
      - name: Require bootstrap provenance and safe initial state
        run: >-
          python -c
          "import json;
          p=json.load(open('build/cfa_fra_live_consumer_seed/PYACCOUNTINGKIT_CONSUMER_BOOTSTRAP.json'));
          assert p['source']['oracle_tree_sha']=='07d4880534d2e2239e19fd4ef4139de70b56773a';
          assert p['framework_requirement']=='pyaccountingkit>=0.6.0b26,<0.7';
          assert p['binding_state']=='UNBOUND_UNTIL_PUBLISHED';
          assert p['cutover_state']=='NOT_STARTED'"

  consumer-publication:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA consumer publication handoff
    needs: [consumer-bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Materialize isolated standalone consumer
        run: >-
          python scripts/bootstrap_cfa_fra_live_consumer.py
          --destination build/cfa_fra_published_consumer
          --write
      - name: Publish isolated Git identity
        run: |
          git -C build/cfa_fra_published_consumer init -b main
          git -C build/cfa_fra_published_consumer config user.email "qualification@example.invalid"
          git -C build/cfa_fra_published_consumer config user.name "Qualification"
          git -C build/cfa_fra_published_consumer add .
          git -C build/cfa_fra_published_consumer commit -m "Bootstrap standalone CFA FRA consumer"
          git -C build/cfa_fra_published_consumer remote add origin https://github.com/tawounfouet/cfa-fra-live
      - name: Prepare isolated canonical binding
        run: >-
          cp tests/consumer/cfa_fra/CONSUMER_BINDING.json
          build/cfa_fra_consumer_binding.json
      - name: Plan reviewed publication handoff
        run: >-
          python scripts/run_cfa_fra_consumer_publication.py
          --binding build/cfa_fra_consumer_binding.json
          plan
          --consumer-root build/cfa_fra_published_consumer
          --repository tawounfouet/cfa-fra-live
          --observed-at 2026-10-01T07:00:00Z
          --producer github-actions
          --plan-output build/cfa_fra_consumer_publication_plan.json
      - name: Apply reviewed publication handoff
        run: >-
          python scripts/run_cfa_fra_consumer_publication.py
          --binding build/cfa_fra_consumer_binding.json
          apply
          --consumer-root build/cfa_fra_published_consumer
          --plan build/cfa_fra_consumer_publication_plan.json
          --write
      - name: Require verified BOUND v2 publication identity
        run: >-
          python scripts/validate_cfa_fra_consumer_binding.py
          --binding build/cfa_fra_consumer_binding.json
          --require-bound
          --output build/cfa_fra_verified_publication_binding.json
      - name: Require publication provenance fingerprints
        run: >-
          python -c
          "import json;
          p=json.load(open('build/cfa_fra_verified_publication_binding.json'));
          assert p['bound'] is True;
          assert len(p['bootstrap_sha256'])==64;
          assert len(p['publication_sha256'])==64"

  consumer-binding-advancement:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA consumer binding revision advancement
    needs: [consumer-publication]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Materialize isolated standalone consumer
        run: >-
          python scripts/bootstrap_cfa_fra_live_consumer.py
          --destination build/cfa_fra_advancing_consumer
          --write
      - name: Publish isolated Git identity
        run: |
          git -C build/cfa_fra_advancing_consumer init -b main
          git -C build/cfa_fra_advancing_consumer config user.email "qualification@example.invalid"
          git -C build/cfa_fra_advancing_consumer config user.name "Qualification"
          git -C build/cfa_fra_advancing_consumer add .
          git -C build/cfa_fra_advancing_consumer commit -m "Bootstrap standalone CFA FRA consumer"
          git -C build/cfa_fra_advancing_consumer remote add origin https://github.com/tawounfouet/cfa-fra-live
      - name: Prepare and bind isolated consumer
        run: |
          cp tests/consumer/cfa_fra/CONSUMER_BINDING.json build/cfa_fra_advancement_binding.json
          python scripts/run_cfa_fra_consumer_publication.py \
            --binding build/cfa_fra_advancement_binding.json \
            plan \
            --consumer-root build/cfa_fra_advancing_consumer \
            --repository tawounfouet/cfa-fra-live \
            --observed-at 2026-10-01T07:00:00Z \
            --producer github-actions \
            --plan-output build/cfa_fra_initial_publication_plan.json
          python scripts/run_cfa_fra_consumer_publication.py \
            --binding build/cfa_fra_advancement_binding.json \
            apply \
            --consumer-root build/cfa_fra_advancing_consumer \
            --plan build/cfa_fra_initial_publication_plan.json \
            --write
      - name: Record initially bound revision
        run: >-
          python -c
          "import json,pathlib;
          b=json.load(open('build/cfa_fra_advancement_binding.json'));
          pathlib.Path('build/cfa_fra_old_revision.txt').write_text(b['binding']['revision_sha']);
          pathlib.Path('build/cfa_fra_old_bootstrap.txt').write_text(b['binding']['bootstrap_sha256'])"
      - name: Create descendant cutover revision
        run: |
          printf '%s\n' 'target-only rewiring started' > build/cfa_fra_advancing_consumer/CUTOVER_PROGRESS.md
          git -C build/cfa_fra_advancing_consumer add CUTOVER_PROGRESS.md
          git -C build/cfa_fra_advancing_consumer commit -m "Start target-only rewiring"
      - name: Plan reviewed binding advancement
        run: >-
          python scripts/run_cfa_fra_consumer_binding_advancement.py
          --binding build/cfa_fra_advancement_binding.json
          plan
          --consumer-root build/cfa_fra_advancing_consumer
          --observed-at 2026-10-01T08:00:00Z
          --producer github-actions
          --plan-output build/cfa_fra_binding_advancement_plan.json
      - name: Apply reviewed binding advancement
        run: >-
          python scripts/run_cfa_fra_consumer_binding_advancement.py
          --binding build/cfa_fra_advancement_binding.json
          apply
          --consumer-root build/cfa_fra_advancing_consumer
          --plan build/cfa_fra_binding_advancement_plan.json
          --write
      - name: Require monotonic revision with stable identity provenance
        run: >-
          python -c
          "import json,pathlib,subprocess;
          b=json.load(open('build/cfa_fra_advancement_binding.json'));
          old=pathlib.Path('build/cfa_fra_old_revision.txt').read_text();
          old_bootstrap=pathlib.Path('build/cfa_fra_old_bootstrap.txt').read_text();
          new=b['binding']['revision_sha'];
          assert b['status']=='BOUND';
          assert new != old;
          assert b['binding']['repository']=='tawounfouet/cfa-fra-live';
          assert b['binding']['bootstrap_sha256']==old_bootstrap;
          assert subprocess.run(['git','-C','build/cfa_fra_advancing_consumer','merge-base','--is-ancestor',old,new]).returncode==0"

  consumer-binding:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA live consumer binding
    runs-on: ubuntu-latest
    outputs:
      consumer_repository_bound: ${{ steps.binding-state.outputs.consumer_repository_bound }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Validate canonical live consumer binding
        run: >-
          python scripts/validate_cfa_fra_consumer_binding.py
          --output build/cfa_fra_consumer_binding.json
      - name: Expose binding state
        id: binding-state
        run: |
          bound="$(python -c 'import json; print(str(json.load(open("build/cfa_fra_consumer_binding.json"))["bound"]).lower())')"
          echo "consumer_repository_bound=$bound" >> "$GITHUB_OUTPUT"

  consumer-evidence:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA consumer evidence
    runs-on: ubuntu-latest
    outputs:
      consumer_e2e_green: ${{ steps.consumer-state.outputs.consumer_e2e_green }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            resources/cfa_fra_django_mvp_sprint_7/pyproject.toml
      - name: Install PyAccountingKit and bundled CFA FRA test dependencies
        run: >-
          python -m pip install
          -e ".[dev]"
          -e "./resources/cfa_fra_django_mvp_sprint_7[dev]"
      - name: Execute bundled CFA FRA consumer evidence
        run: >-
          python scripts/qualify_cfa_fra_consumer.py
          --output build/cfa_fra_consumer_evidence.json
      - name: Expose consumer E2E state
        id: consumer-state
        run: |
          value="$(python -c 'import json; print(str(json.load(open("build/cfa_fra_consumer_evidence.json"))["consumer_e2e_green"]).lower())')"
          echo "consumer_e2e_green=$value" >> "$GITHUB_OUTPUT"

  retirement-inventory:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA retirement inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Validate legacy-retirement inventory
        run: python scripts/validate_cfa_fra_retirement_inventory.py

  cutover-evidence:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA live cutover evidence
    runs-on: ubuntu-latest
    outputs:
      consumer_e2e_green: ${{ steps.cutover-state.outputs.consumer_e2e_green }}
      identities_traceable: ${{ steps.cutover-state.outputs.identities_traceable }}
      regulatory_authority_replaced: ${{ steps.cutover-state.outputs.regulatory_authority_replaced }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Validate and verify live cutover evidence
        run: >-
          python scripts/validate_cfa_fra_cutover_evidence.py
          --output build/cfa_fra_cutover_evidence.json
      - name: Expose verified cutover state
        id: cutover-state
        run: |
          consumer="$(python -c 'import json; print(str(json.load(open("build/cfa_fra_cutover_evidence.json"))["consumer_e2e_green"]).lower())')"
          identities="$(python -c 'import json; print(str(json.load(open("build/cfa_fra_cutover_evidence.json"))["identities_traceable"]).lower())')"
          authority="$(python -c 'import json; print(str(json.load(open("build/cfa_fra_cutover_evidence.json"))["regulatory_authority_replaced"]).lower())')"
          echo "consumer_e2e_green=$consumer" >> "$GITHUB_OUTPUT"
          echo "identities_traceable=$identities" >> "$GITHUB_OUTPUT"
          echo "regulatory_authority_replaced=$authority" >> "$GITHUB_OUTPUT"

  cutover-pipeline:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA cutover evidence pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Prepare isolated retirement manifest
        run: >-
          mkdir -p build/cfa_fra_cutover_pipeline &&
          cp tests/fixtures/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
      - name: Plan identity evidence transition
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          plan legacy_identities
          --source tests/fixtures/cfa_fra_cutover_generation/identity-source.json
          --artifact legacy-identities.json
          --evidence-source ci-cutover-pipeline
          --observed-at 2026-09-30T15:00:00Z
          --producer github-actions
          --plan-output build/cfa_fra_cutover_pipeline/identity-plan.json
      - name: Apply reviewed identity plan
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          apply
          --plan build/cfa_fra_cutover_pipeline/identity-plan.json
      - name: Plan regulatory authority transition
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          plan regulatory_authority
          --source tests/fixtures/cfa_fra_cutover_generation/regulatory-source.json
          --artifact regulatory-authority.json
          --evidence-source ci-cutover-pipeline
          --observed-at 2026-09-30T15:00:00Z
          --producer github-actions
          --plan-output build/cfa_fra_cutover_pipeline/authority-plan.json
      - name: Apply reviewed regulatory plan
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          apply
          --plan build/cfa_fra_cutover_pipeline/authority-plan.json
      - name: Plan consumer E2E transition
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          plan consumer_e2e
          --source tests/fixtures/cfa_fra_cutover_generation/consumer-e2e-source.json
          --artifact consumer-e2e.json
          --evidence-source ci-cutover-pipeline
          --observed-at 2026-09-30T16:00:00Z
          --producer github-actions
          --plan-output build/cfa_fra_cutover_pipeline/consumer-e2e-plan.json
      - name: Apply reviewed consumer E2E plan
        run: >-
          python scripts/run_cfa_fra_cutover_evidence_pipeline.py
          --manifest build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json
          --artifact-root build/cfa_fra_cutover_pipeline/live_evidence
          apply
          --plan build/cfa_fra_cutover_pipeline/consumer-e2e-plan.json
      - name: Require all external fixture blockers cleared
        run: >-
          python -c
          "import json; p=json.load(open('build/cfa_fra_cutover_pipeline/RETIREMENT_EVIDENCE.json'));
          assert p['expected_blockers'] == [];
          assert p['external_evidence']['consumer_e2e']['status'] == 'PASS';
          assert p['external_evidence']['legacy_identities']['status'] == 'PASS';
          assert p['external_evidence']['regulatory_authority']['status'] == 'PASS'"

  retirement-plan:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA legacy retirement plan
    needs: [retirement-inventory, cutover-pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Build isolated MIG-13 ready retirement plan
        run: >-
          python scripts/plan_cfa_fra_legacy_retirement.py
          --readiness tests/fixtures/cfa_fra_retirement_plan/RETIREMENT_READINESS_READY.json
          --output build/cfa_fra_legacy_retirement_plan.json
      - name: Require frozen oracle preservation and expected plan coverage
        run: >-
          python -c
          "import json; p=json.load(open('build/cfa_fra_legacy_retirement_plan.json'));
          items=p['items'];
          assert len(items)==39;
          assert sum(i['action']=='RETIRE_DUPLICATE_ENGINE' for i in items)==10;
          assert sum(i['action']=='VERIFY_CONSUMER_REWIRED' for i in items)==8;
          assert sum(i['action']=='PRESERVE_OR_MIGRATE_PERSISTENCE' for i in items)==7;
          assert sum(i['action']=='KEEP_CONSUMER_CONCERN' for i in items)==8;
          assert sum(i['action']=='PRESERVE_FROZEN_ORACLE' for i in items)==6"

  retirement-execution:
    if: ${{ !startsWith(github.head_ref, 'release/0.7') }}
    name: CFA FRA legacy retirement execution verification
    needs: [retirement-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Rebuild isolated reviewed retirement plan
        run: >-
          python scripts/plan_cfa_fra_legacy_retirement.py
          --readiness tests/fixtures/cfa_fra_retirement_plan/RETIREMENT_READINESS_READY.json
          --output build/cfa_fra_legacy_retirement_plan.json
      - name: Build isolated post-retirement observations
        run: >-
          python -c
          "import hashlib,json,pathlib;
          p=json.load(open('build/cfa_fra_legacy_retirement_plan.json'));
          states={'RETIRE_DUPLICATE_ENGINE':'RETIRED','VERIFY_CONSUMER_REWIRED':'REWIRED','PRESERVE_OR_MIGRATE_PERSISTENCE':'PRESERVED','KEEP_CONSUMER_CONCERN':'PRESENT','PRESERVE_FROZEN_ORACLE':'PRESERVED'};
          obs=[{'path':i['path'],'state':states[i['action']],'source':'isolated-ci-fixture','evidence_checksum':'sha256:'+hashlib.sha256((i['path']+':'+states[i['action']]).encode()).hexdigest()} for i in p['items']];
          e={'schema_version':'1','plan_sha256':p['plan_sha256'],'consumer_revision':'isolated-ready-fixture-after-retirement','observations':obs};
          pathlib.Path('build/cfa_fra_retirement_execution_evidence.json').write_text(json.dumps(e,indent=2)+'\\n')"
      - name: Verify isolated external retirement execution
        run: >-
          python scripts/verify_cfa_fra_legacy_retirement_execution.py
          --readiness tests/fixtures/cfa_fra_retirement_plan/RETIREMENT_READINESS_READY.json
          --plan build/cfa_fra_legacy_retirement_plan.json
          --evidence build/cfa_fra_retirement_execution_evidence.json
          --output build/cfa_fra_retirement_execution_receipt.json
      - name: Require complete verified retirement receipt
        run: >-
          python -c
          "import json; r=json.load(open('build/cfa_fra_retirement_execution_receipt.json'));
          obs=r['observations'];
          assert r['verified'] is True;
          assert len(obs)==39;
          assert sum(i['state']=='RETIRED' for i in obs)==10;
          assert sum(i['state']=='REWIRED' for i in obs)==8;
          assert sum(i['state']=='PRESERVED' for i in obs)==13;
          assert sum(i['state']=='PRESENT' for i in obs)==8"

