services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cfa_fra}
      POSTGRES_USER: ${POSTGRES_USER:-cfa_fra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cfa_fra}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cfa_fra} -d ${POSTGRES_DB:-cfa_fra}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cfa_fra:cfa_fra@db:5432/cfa_fra}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
