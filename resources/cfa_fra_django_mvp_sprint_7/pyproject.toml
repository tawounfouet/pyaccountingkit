[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfa-fra-django"
version = "0.8.0"
description = "CFA FRA Accounting & Financial Reporting Engine - Django/HTMX MVP"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6",
    "psycopg[binary]>=3.2,<4",
    "django-environ>=0.12,<1",
    "django-htmx>=1.23,<2",
    "django-filter>=25.1,<26",
    "whitenoise>=6.9,<7",
    "XlsxWriter>=3.2,<4",
    "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "django-stubs>=5.2,<6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --tb=short"
testpaths = ["tests", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.test"


[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]
